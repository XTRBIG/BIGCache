name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test -race -count=1 ./...
      - name: Smoke test
        run: ./scripts/smoke.sh
      - name: Cross-compile
        run: |
          GOOS=linux  GOARCH=arm64 go build -o /dev/null ./cmd/bigcache
          GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/bigcache
          GOOS=windows GOARCH=amd64 go build -o dist/bigcache.exe ./cmd/bigcache
      - uses: actions/upload-artifact@v4
        with:
          name: bigcache-windows-x64-${{ github.sha }}
          path: dist/bigcache.exe
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go build -o bigcache.exe ./cmd/bigcache && .\bigcache.exe bench --ops 20000 --cache-size 16M --volume-size 64M --working-set 8M
