name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test -race -count=1 ./...
      - name: Smoke test
        run: ./scripts/smoke.sh
      - name: Cross-compile
        run: |
          GOOS=linux  GOARCH=arm64 go build -o /dev/null ./cmd/bigcache
          GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/bigcache
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/bigcache
